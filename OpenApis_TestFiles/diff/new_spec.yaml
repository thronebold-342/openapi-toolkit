openapi: "3.0.0"
info:
  title: Sample API
  version: "2.0.0"

paths:
  /users:
    get:
      summary: List users
      parameters:
        - name: role
          in: query
          required: true
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      summary: Create a user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: verbose
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: A single user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      summary: Replace a user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: User replaced

  /products:
    get:
      summary: List products
      responses:
        "200":
          description: A list of products

components:
  schemas:
    User:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: string
        role:
          type: string
        name:
          type: string
        phone:
          type: string

    Order:
      type: object
      properties:
        id:
          type: string
        currency:
          type: string